name: PR quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_ROOT_PASSWORD: mdpe12-ci-fixture
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test Oracle MySQL adapter against InnoDB
        env:
          PARADIGM_MYSQL_TEST_CONNECTION_STRING: Server=127.0.0.1;Port=${{ job.services.mysql.ports['3306'] }};User ID=root;Password=mdpe12-ci-fixture;SslMode=Disabled;AllowPublicKeyRetrieval=True
        run: >-
          dotnet test src/Paradigm.Enterprise.Data.MySql.Tests/Paradigm.Enterprise.Data.MySql.Tests.csproj
          --configuration Release --filter "TestCategory=Integration"
          --logger "console;verbosity=normal"
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore src/Paradigm.Enterprise.slnx
      - name: Build and test source
        run: |
          dotnet build src/Paradigm.Enterprise.slnx --configuration Release --no-restore --property:CopyLocalLockFileAssemblies=true
          dotnet test src/Paradigm.Enterprise.slnx --configuration Release --no-build --filter "TestCategory!=Integration"
      - name: Pack current release and build example
        run: |
          dotnet pack src/Paradigm.Enterprise.slnx --configuration Release --no-build --output artifacts
          dotnet restore example/ExampleApp.sln --property:RestoreAdditionalProjectSources=${{ github.workspace }}/artifacts
          dotnet build example/ExampleApp.sln --configuration Release --no-restore
          dotnet test example/ExampleApp.sln --configuration Release --no-build
      - name: Install and test the packed Paradigm CLI
        timeout-minutes: 6
        shell: pwsh
        run: |
          $version = ([xml](Get-Content -Raw build/Paradigm.Version.props)).Project.PropertyGroup.ParadigmEnterpriseVersion
          dotnet tool install --tool-path .paradigm/tools --add-source artifacts --no-cache Paradigm.Enterprise.Cli --version $version
          $env:PARADIGM_CLI_INTEGRATION_PACKAGE = (Resolve-Path "artifacts/Paradigm.Enterprise.Cli.$version.nupkg").Path
          $env:PARADIGM_CLI_INTEGRATION_EXECUTABLE = (Resolve-Path ".paradigm/tools/paradigm").Path
          dotnet test src/Paradigm.Enterprise.Cli.Tests/Paradigm.Enterprise.Cli.Tests.csproj --configuration Release --no-build --filter "TestCategory=Integration" --logger "console;verbosity=normal"
      - name: Deterministic quality checks
        run: |
          .paradigm/tools/paradigm packages check --project src/Paradigm.Enterprise.slnx
          .paradigm/tools/paradigm packages audit --project src/Paradigm.Enterprise.slnx
          .paradigm/tools/paradigm packages check --project example/ExampleApp.sln
          .paradigm/tools/paradigm packages audit --project example/ExampleApp.sln
          .paradigm/tools/paradigm checks run --project src/Paradigm.Enterprise.Cli/Paradigm.Enterprise.Cli.csproj
          .paradigm/tools/paradigm checks run --project src/Paradigm.Enterprise.Cli.Tests/Paradigm.Enterprise.Cli.Tests.csproj
          .paradigm/tools/paradigm checks run --project src/Paradigm.Enterprise.Checks.CSharp/Paradigm.Enterprise.Checks.CSharp.csproj
          .paradigm/tools/paradigm checks run --project src/Paradigm.Enterprise.CodeGenerator/Paradigm.Enterprise.CodeGenerator.csproj
          .paradigm/tools/paradigm checks run --project src/Paradigm.Enterprise.Data.MySql/Paradigm.Enterprise.Data.MySql.csproj
          .paradigm/tools/paradigm validate --project example/ExampleApp.sln
          .paradigm/tools/paradigm checks run --project example/ExampleApp.sln
          pwsh build/verify-version.ps1
      - name: Validate skills and plugin
        run: |
          python .github/scripts/validate-skills.py
          python .github/scripts/validate-plugin.py
      - name: Build documentation
        run: dotnet docfx docs/docfx.json --warningsAsErrors
