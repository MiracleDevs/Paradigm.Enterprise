name: PR quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ format('BeaconAr-{0}-Aa1!', github.run_id) }}
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - name: Register Paradigm problem matcher
        run: echo "::add-matcher::${{ github.workspace }}/.github/problem-matchers/paradigm.json"
      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore src/Paradigm.Enterprise.slnx
      - name: Build and test source
        run: |
          dotnet build src/Paradigm.Enterprise.slnx --configuration Release --no-restore
          dotnet test src/Paradigm.Enterprise.slnx --configuration Release --no-build --filter "TestCategory!=Integration"
      - name: Pack current release and build example
        run: |
          dotnet pack src/Paradigm.Enterprise.slnx --configuration Release --no-build --output artifacts
          pwsh build/verify-packages.ps1 -ArtifactsDirectory artifacts
          dotnet restore examples/inventory-crud/InventoryCrud.sln --property:RestoreAdditionalProjectSources=${{ github.workspace }}/artifacts
          dotnet build examples/inventory-crud/InventoryCrud.sln --configuration Release --no-restore
          dotnet test examples/inventory-crud/InventoryCrud.sln --configuration Release --no-build
      - name: Build and test Beacon AR foundation
        working-directory: examples/beacon-ar
        run: |
          dotnet tool restore --add-source ../../artifacts
          dotnet restore BeaconAr.slnx --property:RestoreAdditionalProjectSources=${{ github.workspace }}/artifacts
          dotnet build BeaconAr.slnx --configuration Release --no-restore
          dotnet test tests/BeaconAr.DatabaseBootstrap.Tests/BeaconAr.DatabaseBootstrap.Tests.csproj --configuration Release --no-build --no-restore
          dotnet test tests/BeaconAr.Domain.Tests/BeaconAr.Domain.Tests.csproj --configuration Release --no-build --no-restore
          dotnet test tests/BeaconAr.Providers.Tests/BeaconAr.Providers.Tests.csproj --configuration Release --no-build --no-restore
          dotnet test tests/BeaconAr.Architecture.Tests/BeaconAr.Architecture.Tests.csproj --configuration Release --no-build --no-restore
          dotnet test tests/BeaconAr.WebApi.Tests/BeaconAr.WebApi.Tests.csproj --configuration Release --no-build --no-restore --filter "TestCategory!=Integration"
          if dotnet run --project src/BeaconAr.CodeGenerator/BeaconAr.CodeGenerator.csproj --configuration Release --no-build -- invalid; then
            echo "Code generation unexpectedly accepted an unknown target." >&2
            exit 1
          fi
      - name: Publish and integration-test Beacon AR database
        working-directory: examples/beacon-ar
        env:
          BEACON_AR_CI_SQL_PASSWORD: ${{ format('BeaconAr-{0}-Aa1!', github.run_id) }}
          ConnectionStrings__DatabaseConnection: Server=localhost,1433;Initial Catalog=BeaconAr;User ID=sa;Password=${{ format('BeaconAr-{0}-Aa1!', github.run_id) }};Encrypt=True;TrustServerCertificate=True
          Database__Mode: Managed
          Database__PublishOnStart: true
        run: |
          docker build --file src/BeaconAr.DatabaseBootstrap/Dockerfile --tag beacon-ar-database-bootstrap:ci ../..
          for attempt in {1..60}; do
            if docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$BEACON_AR_CI_SQL_PASSWORD" -Q "SELECT 1" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "SQL Server did not become ready." >&2
              exit 1
            fi
            sleep 2
          done
          docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$BEACON_AR_CI_SQL_PASSWORD" -Q "CREATE DATABASE [BeaconAr]"
          bootstrap_container=""
          cleanup_bootstrap() {
            if [ -n "$bootstrap_container" ]; then
              docker rm --force "$bootstrap_container" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_bootstrap EXIT
          run_database_bootstrap() {
            bootstrap_container="$(docker create --network host \
              --env ConnectionStrings__DatabaseConnection \
              --env Database__Mode \
              --env Database__PublishOnStart \
              beacon-ar-database-bootstrap:ci)"
            docker start --attach "$bootstrap_container"
            mkdir -p artifacts/database
            docker cp "$bootstrap_container:/app/artifacts/." artifacts/database/
            docker rm "$bootstrap_container" >/dev/null
            bootstrap_container=""
          }
          run_database_bootstrap
          dotnet test tests/BeaconAr.Database.IntegrationTests/BeaconAr.Database.IntegrationTests.csproj --configuration Release --no-build --no-restore
          dotnet test tests/BeaconAr.WebApi.Tests/BeaconAr.WebApi.Tests.csproj --configuration Release --no-build --no-restore --filter "TestCategory=Integration"
          run_database_bootstrap
          pwsh build/regenerate-persistence.ps1
          git diff --exit-code -- src/BeaconAr.Data/Receivables/Generated src/BeaconAr.Domain/Receivables/Generated
          test -z "$(git status --porcelain --untracked-files=all -- src/BeaconAr.Data/Receivables/Generated src/BeaconAr.Domain/Receivables/Generated)"
          python - <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          report = pathlib.Path("artifacts/database/BeaconAr.Database.deployreport.xml")
          operations = ET.parse(report).getroot().findall(".//{*}Operation")
          if operations:
              print("Second publication reported schema operations:", [item.get("Name") for item in operations], file=sys.stderr)
              raise SystemExit(1)
          PY
          trap - EXIT
      - name: Generate and compile Beacon AR API client
        working-directory: examples/beacon-ar
        run: |
          dotnet run --project src/BeaconAr.CodeGenerator/BeaconAr.CodeGenerator.csproj --configuration Release --no-build -- openapi-typescript ../../artifacts/openapi/beacon-ar-v1.json ../../tests/BeaconAr.ClientContract/generated/beacon-ar-v1.ts
          npm ci --prefix tests/BeaconAr.ClientContract
          npm run check --prefix tests/BeaconAr.ClientContract
      - name: Publish Beacon AR API v1 contract
        uses: actions/upload-artifact@v6
        with:
          name: beacon-ar-api-v1
          path: |
            examples/beacon-ar/artifacts/openapi/beacon-ar-v1.json
            examples/beacon-ar/tests/BeaconAr.ClientContract/generated/beacon-ar-v1.ts
          if-no-files-found: error
      - name: Install and test the packed Paradigm CLI
        shell: pwsh
        run: |
          $version = ([xml](Get-Content -Raw build/Paradigm.Version.props)).Project.PropertyGroup.ParadigmEnterpriseVersion
          dotnet tool install --tool-path .paradigm/tools --add-source artifacts --no-cache Paradigm.Enterprise.Cli --version $version
          $env:PARADIGM_CLI_INTEGRATION_PACKAGE = (Resolve-Path "artifacts/Paradigm.Enterprise.Cli.$version.nupkg").Path
          $env:PARADIGM_CLI_INTEGRATION_EXECUTABLE = (Resolve-Path ".paradigm/tools/paradigm").Path
          dotnet test src/Paradigm.Enterprise.Cli.Tests/Paradigm.Enterprise.Cli.Tests.csproj --configuration Release --no-build --filter "TestCategory=Integration"
      - name: Deterministic quality checks
        run: |
          .paradigm/tools/paradigm packages check --project src/Paradigm.Enterprise.slnx
          .paradigm/tools/paradigm packages audit --project src/Paradigm.Enterprise.slnx
          .paradigm/tools/paradigm packages check --project examples/inventory-crud/InventoryCrud.sln
          .paradigm/tools/paradigm packages audit --project examples/inventory-crud/InventoryCrud.sln
          .paradigm/tools/paradigm checks run --project src/Paradigm.Enterprise.Cli/Paradigm.Enterprise.Cli.csproj
          .paradigm/tools/paradigm checks run --project src/Paradigm.Enterprise.Cli.Tests/Paradigm.Enterprise.Cli.Tests.csproj
          .paradigm/tools/paradigm checks run --project src/Paradigm.Enterprise.Checks.CSharp/Paradigm.Enterprise.Checks.CSharp.csproj
          .paradigm/tools/paradigm checks run --project src/Paradigm.Enterprise.CodeGenerator/Paradigm.Enterprise.CodeGenerator.csproj
          .paradigm/tools/paradigm validate --project examples/inventory-crud/InventoryCrud.sln
          .paradigm/tools/paradigm checks run --project examples/inventory-crud/InventoryCrud.sln
          .paradigm/tools/paradigm packages check --project examples/beacon-ar/BeaconAr.slnx
          .paradigm/tools/paradigm packages audit --project examples/beacon-ar/BeaconAr.slnx
          .paradigm/tools/paradigm validate --project examples/beacon-ar/BeaconAr.slnx
          .paradigm/tools/paradigm checks run --project examples/beacon-ar/src/BeaconAr.Domain/BeaconAr.Domain.csproj
          .paradigm/tools/paradigm checks run --project examples/beacon-ar/src/BeaconAr.Data/BeaconAr.Data.csproj
          .paradigm/tools/paradigm checks run --project examples/beacon-ar/src/BeaconAr.Providers/BeaconAr.Providers.csproj
          .paradigm/tools/paradigm checks run --project examples/beacon-ar/src/BeaconAr.WebApi/BeaconAr.WebApi.csproj
          .paradigm/tools/paradigm database validate --project examples/beacon-ar/src/database/BeaconAr.Database.sqlproj --solution examples/beacon-ar/BeaconAr.slnx --strict
          pwsh build/verify-version.ps1
      - name: Validate skills and plugin
        run: |
          python .github/scripts/validate-skills.py
          python .github/scripts/validate-plugin.py
      - name: Build documentation
        run: dotnet docfx docs/docfx.json --warningsAsErrors
