name: Weekly dependency audit

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Register Paradigm problem matcher
        run: echo "::add-matcher::${{ github.workspace }}/.github/problem-matchers/paradigm.json"
      - run: dotnet restore src/Paradigm.Enterprise.slnx
      - run: dotnet build src/Paradigm.Enterprise.Cli/Paradigm.Enterprise.Cli.csproj --configuration Release --no-restore
      - name: Pack and install CLI
        shell: pwsh
        run: |
          $version = ([xml](Get-Content -Raw build/Paradigm.Version.props)).Project.PropertyGroup.ParadigmEnterpriseVersion
          dotnet pack src/Paradigm.Enterprise.Cli/Paradigm.Enterprise.Cli.csproj --configuration Release --no-build --output artifacts
          ./build/verify-packages.ps1 -ArtifactsDirectory artifacts
          dotnet tool install --tool-path .paradigm/tools --add-source artifacts --no-cache Paradigm.Enterprise.Cli --version $version
      - run: .paradigm/tools/paradigm packages audit --project src/Paradigm.Enterprise.slnx
